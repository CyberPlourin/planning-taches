<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="mobile-web-app-capable" content="yes">
<title>Planning des tâches</title>
<style>
  :root{
    --bg:#f4f5f2; --card:#ffffff; --ink:#1f2421; --muted:#6b726d; --line:#dfe3df;
    --accent:#2f6f5e; --accent-ink:#ffffff; --done:#d8efe2; --done-ink:#1d5a3f; --empty:#fafbf9;
    --head:#eceee9; --danger:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141716; --card:#1d211f; --ink:#e8ebe8; --muted:#9aa29c; --line:#2e3431;
      --accent:#5fb39a; --accent-ink:#0d1512; --done:#1f3d30; --done-ink:#9ee0bf; --empty:#181b1a;
      --head:#232826; --danger:#f2867e;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:8px}
  h1{font-size:1.15rem;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mode{display:flex;background:var(--head);border-radius:999px;padding:3px}
  .mode button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;font:inherit;font-size:.85rem}
  .mode button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .progress{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.85rem;color:var(--muted)}
  .bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  main{padding:12px 0 100px}
  .wrap{overflow-x:auto;padding:0 16px;-webkit-overflow-scrolling:touch}
  table{border-collapse:separate;border-spacing:6px;min-width:100%}
  th{background:var(--head);color:var(--ink);font-size:.8rem;font-weight:600;padding:8px 6px;border-radius:8px;
     min-width:92px;text-align:center;white-space:nowrap}
  th.corner{background:transparent;min-width:0}
  tbody th{position:sticky;left:0;z-index:2;min-width:80px;max-width:110px;white-space:normal;
     box-shadow:-16px 0 0 var(--bg)}
  td{padding:0}
  .cell{width:100%;min-height:64px;border:1px solid var(--line);background:var(--card);color:var(--ink);
     border-radius:10px;padding:8px 6px;font:inherit;font-size:.85rem;line-height:1.25;text-align:center;
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
     transition:background .15s,transform .08s}
  .cell:active{transform:scale(.96)}
  .cell.empty{background:var(--empty);color:var(--muted);border-style:dashed}
  .cell.done{background:var(--done);color:var(--done-ink);border-color:transparent}
  .cell.done .txt{text-decoration:line-through;opacity:.8}
  .cell .chk{font-size:1.1rem;line-height:1}
  .cell .when{font-size:.68rem;opacity:.75}
  body.edit .cell{border-style:dashed;border-color:var(--accent)}
  body.edit th.hd{outline:1px dashed var(--accent);cursor:pointer}
  .editbar{display:none;flex-wrap:wrap;gap:8px;padding:14px 16px 0}
  body.edit .editbar{display:flex}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:.85rem}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
  .btn.danger{color:var(--danger)}
  .actions{display:flex;flex-wrap:wrap;gap:8px;padding:16px}
  .hint{padding:0 16px;color:var(--muted);font-size:.8rem}
  dialog{border:0;border-radius:14px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h2{margin:0 0 10px;font-size:1rem}
  dialog textarea,dialog input{width:100%;font:inherit;font-size:1rem;padding:10px;border-radius:10px;border:1px solid var(--line);
     background:var(--bg);color:var(--ink)}
  dialog textarea{min-height:80px;resize:vertical}
  .drow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  .drow .left{margin-right:auto}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Planning</h1>
    <div class="mode" role="tablist">
      <button id="mCheck" class="on">Cocher</button>
      <button id="mEdit">Modifier</button>
    </div>
  </div>
  <div class="progress"><div class="bar"><i id="barFill"></i></div><span id="count">0/0</span></div>
</header>

<main>
  <div class="editbar">
    <button class="btn" id="addRow">+ Ligne</button>
    <button class="btn" id="addCol">+ Colonne</button>
    <button class="btn" id="renameTitle">Renommer le planning</button>
  </div>
  <p class="hint" id="hint"></p>
  <div class="wrap"><table id="grid"></table></div>
  <div class="actions">
    <button class="btn" id="reset">Tout décocher</button>
    <button class="btn" id="export">Sauvegarder (fichier)</button>
    <button class="btn" id="import">Restaurer</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
</main>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <textarea id="dlgText"></textarea>
  <div class="drow">
    <button class="btn danger left" id="dlgDelete">Supprimer</button>
    <button class="btn" id="dlgCancel">Annuler</button>
    <button class="btn primary" id="dlgOk">OK</button>
  </div>
</dialog>

<script>
const KEY = 'planning-taches-v1';
const DEFAULT = {
  title: 'Planning de la semaine',
  cols: ['Lun','Mar','Mer','Jeu','Ven','Sam'],
  rows: ['Matin','Midi','Soir'],
  cells: {
    '0-0':{t:'Sortir les poubelles'}, '0-2':{t:'Arroser les plantes'}, '0-4':{t:'Courses'},
    '1-1':{t:'Appeler le médecin'}, '1-3':{t:'Lessive'},
    '2-0':{t:'Ménage cuisine'}, '2-5':{t:'Préparer la semaine'}
  }
};
let S, editMode = false;

function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return structuredClone(DEFAULT);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
S = load();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = ts => { const d = new Date(ts);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); };

function render(){
  $('title').textContent = S.title;
  document.title = S.title;
  let h = '<thead><tr><th class="corner"></th>';
  S.cols.forEach((c,j) => h += `<th class="hd" data-col="${j}">${esc(c)}</th>`);
  h += '</tr></thead><tbody>';
  let total = 0, done = 0;
  S.rows.forEach((r,i) => {
    h += `<tr><th class="hd" data-row="${i}">${esc(r)}</th>`;
    S.cols.forEach((_,j) => {
      const c = S.cells[i+'-'+j];
      if(c && c.t){
        total++; if(c.d) done++;
        h += `<td><button class="cell${c.d?' done':''}" data-k="${i}-${j}">
          ${c.d?'<span class="chk">✓</span>':''}<span class="txt">${esc(c.t)}</span>
          ${c.d?`<span class="when">${fmt(c.d)}</span>`:''}</button></td>`;
      } else {
        h += `<td><button class="cell empty" data-k="${i}-${j}">${editMode?'+':''}</button></td>`;
      }
    });
    h += '</tr>';
  });
  $('grid').innerHTML = h + '</tbody>';
  $('count').textContent = `${done}/${total}`;
  $('barFill').style.width = total ? (100*done/total)+'%' : '0';
  $('hint').textContent = editMode
    ? 'Touchez une case pour écrire la tâche, un en-tête pour le renommer ou le supprimer.'
    : 'Touchez une tâche pour la marquer comme faite (ou annuler).';
}

function setMode(e){
  editMode = e;
  document.body.classList.toggle('edit', e);
  $('mEdit').classList.toggle('on', e);
  $('mCheck').classList.toggle('on', !e);
  render();
}
$('mCheck').onclick = () => setMode(false);
$('mEdit').onclick = () => setMode(true);

// Boîte de dialogue générique
let dlgCb = null, dlgDel = null;
function ask(title, value, onOk, onDelete){
  $('dlgTitle').textContent = title;
  $('dlgText').value = value || '';
  dlgCb = onOk; dlgDel = onDelete;
  $('dlgDelete').style.display = onDelete ? '' : 'none';
  $('dlg').showModal();
  setTimeout(() => $('dlgText').focus(), 50);
}
$('dlgOk').onclick = () => { const v = $('dlgText').value.trim(); $('dlg').close(); dlgCb && dlgCb(v); };
$('dlgCancel').onclick = () => $('dlg').close();
$('dlgDelete').onclick = () => { $('dlg').close(); dlgDel && dlgDel(); };

$('grid').addEventListener('click', ev => {
  const cell = ev.target.closest('.cell');
  const hd = ev.target.closest('th.hd');
  if(cell){
    const k = cell.dataset.k, c = S.cells[k];
    if(editMode){
      ask('Tâche', c && c.t, v => {
        if(v) S.cells[k] = {t:v, d: c && c.t === v ? c.d : null};
        else delete S.cells[k];
        save(); render();
      }, c && c.t ? () => { delete S.cells[k]; save(); render(); } : null);
    } else if(c && c.t){
      c.d = c.d ? null : Date.now();
      if(navigator.vibrate) navigator.vibrate(15);
      save(); render();
    }
  } else if(hd && editMode){
    if(hd.dataset.col !== undefined){
      const j = +hd.dataset.col;
      ask('Colonne', S.cols[j], v => { if(v){ S.cols[j] = v; save(); render(); } },
        S.cols.length > 1 ? () => removeCol(j) : null);
    } else {
      const i = +hd.dataset.row;
      ask('Ligne', S.rows[i], v => { if(v){ S.rows[i] = v; save(); render(); } },
        S.rows.length > 1 ? () => removeRow(i) : null);
    }
  }
});

// Suppression d'une ligne/colonne : on décale les clés des cases
function remap(fn){
  const n = {};
  for(const k in S.cells){ const [i,j] = k.split('-').map(Number); const r = fn(i,j); if(r) n[r] = S.cells[k]; }
  S.cells = n;
}
function removeRow(i){
  if(!confirm(`Supprimer la ligne « ${S.rows[i]} » et ses tâches ?`)) return;
  S.rows.splice(i,1);
  remap((a,b) => a===i ? null : `${a>i?a-1:a}-${b}`);
  save(); render();
}
function removeCol(j){
  if(!confirm(`Supprimer la colonne « ${S.cols[j]} » et ses tâches ?`)) return;
  S.cols.splice(j,1);
  remap((a,b) => b===j ? null : `${a}-${b>j?b-1:b}`);
  save(); render();
}
$('addRow').onclick = () => ask('Nouvelle ligne', '', v => { if(v){ S.rows.push(v); save(); render(); } });
$('addCol').onclick = () => ask('Nouvelle colonne', '', v => { if(v){ S.cols.push(v); save(); render(); } });
$('renameTitle').onclick = () => ask('Nom du planning', S.title, v => { if(v){ S.title = v; save(); render(); } });

$('reset').onclick = () => {
  if(!confirm('Décocher toutes les tâches ? (les tâches restent en place)')) return;
  for(const k in S.cells) S.cells[k].d = null;
  save(); render();
};
$('export').onclick = () => {
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'planning-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('import').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!Array.isArray(d.rows) || !Array.isArray(d.cols) || typeof d.cells !== 'object') throw 0;
    if(!confirm('Remplacer le planning actuel par celui du fichier ?')) return;
    S = d; save(); render();
  }catch(_){ alert('Fichier invalide.'); }
  e.target.value = '';
};

render();
</script>
</body>
</html>
